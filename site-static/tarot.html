<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>喵喵占卜|Jessica 解憂商店</title>
<meta name="description" content="抽三張牌,由本喵占卜師為你解讀感情、工作、金錢或人生抉擇。" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Huninn&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="./assets/style.css" />
</head>
<body class="tarot-page">

<!-- 洗牌動畫:滿版覆蓋、鎖住捲動,播完才淡出露出牌面 -->
<div class="draw-overlay" id="drawOverlay" style="display:none">
  <video id="drawVideo" class="draw-overlay-video" playsinline preload="auto" poster="./assets/videos/tarot-draw-poster.jpg">
    <source src="./assets/videos/tarot-draw.webm" type="video/webm" />
    <source src="./assets/videos/tarot-draw.mp4" type="video/mp4" />
  </video>
</div>

<main class="wrap-sm rise">
  <div class="tarot-bar">
    <span class="tarot-credits" id="creditsBadge">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path stroke-linecap="round" stroke-linejoin="round" d="M12 3l2.5 6.5L21 12l-6.5 2.5L12 21l-2.5-6.5L3 12l6.5-2.5z"/></svg>
      <span id="creditsText">剩餘 3 次</span>
    </span>
    <button type="button" class="sound-toggle" id="soundToggle" aria-pressed="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path stroke-linecap="round" stroke-linejoin="round" d="M11 5L6.5 9H3v6h3.5L11 19z"/><path class="wave" stroke-linecap="round" d="M15.5 9.2a4 4 0 010 5.6M18.4 6.6a8 8 0 010 10.8"/><path class="cross" stroke-linecap="round" d="M16 10l5 4m0-4l-5 4" style="display:none"/></svg>
      <span id="soundLabel">貓叫聲</span>
    </button>
  </div>

  <!-- 額度用完:導向購買 -->
  <div class="card tarot-locked" id="lockedPanel" style="display:none">
    <div class="dot" style="margin-inline:auto"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path stroke-linecap="round" stroke-linejoin="round" d="M12 3l2.5 6.5L21 12l-6.5 2.5L12 21l-2.5-6.5L3 12l6.5-2.5z"/></svg></div>
    <h2 class="display" style="font-size:19px;margin-top:14px">占卜次數已用完</h2>
    <p style="margin-top:8px;font-size:13px;color:var(--inkdim)">NT$100 可再加購 3 次喵喵占卜</p>
    <a class="btn-primary" href="./checkout/tarot.html">前往加購</a>
  </div>

  <div id="tarotFlow">
    <!-- 本喵占卜師:整段流程都透過這個對話框跟客人說話 -->
    <div class="cat-dialogue" id="catDialogue">
      <div class="cat-dialogue-top">
        <span class="cat-dialogue-avatar" id="dialogueAvatar"></span>
        <span class="cat-dialogue-name">喵喵占卜師</span>
      </div>
      <p class="cat-dialogue-text" id="dialogueText"></p>
      <span class="cat-dialogue-caret" id="dialogueCaret" style="display:none">▼</span>
    </div>

    <!-- 說完開場白才出現 -->
    <div class="step-panel" id="topicPanel" style="display:none">
      <div class="topic-chips" id="topicChips">
        <button type="button" class="topic-chip" data-topic="love">感情</button>
        <button type="button" class="topic-chip" data-topic="career">工作</button>
        <button type="button" class="topic-chip" data-topic="money">金錢</button>
        <button type="button" class="topic-chip" data-topic="decision">抉擇</button>
        <button type="button" class="topic-chip" data-topic="other">其他</button>
      </div>
    </div>

    <!-- 選好主題才出現 -->
    <div class="step-panel" id="questionPanel" style="display:none">
      <label class="pay-field tarot-question">
        <input class="pay-input" id="questionInput" placeholder="把想問的事寫在這裡⋯" maxlength="60" />
        <p class="field-hint" id="questionHint">至少寫五個字,本喵才聽得清楚</p>
      </label>
      <button type="button" class="btn-primary" id="drawBtn" style="width:100%">交給本喵</button>
    </div>

    <!-- 三張卡片由 JS 建立 -->
    <div class="tarot-deck" id="tarotDeck" style="display:none"></div>

    <div class="card tarot-result" id="resultPanel">
      <p class="eyebrow">Reading</p>
      <h2 class="display" style="font-size:18px;margin-top:6px">牌面解讀</h2>
      <ul class="reading-list" id="cardSummary"></ul>
      <div class="tarot-loading" id="loadingNote" style="display:none">
        <span class="thinking-cat" id="thinkingCat"></span>
        <span>喵喵占卜師思考中<span class="dots"><i>.</i><i>.</i><i>.</i></span></span>
      </div>
      <div class="tarot-error" id="errorNote" style="display:none"></div>

      <div class="reading-summary" id="readingSummary" style="display:none">
        <p class="eyebrow">Summary</p>
        <h3 class="display">喵喵占卜師的完整解讀</h3>
        <ol id="summaryList"></ol>
      </div>

      <div class="tarot-actions">
        <button type="button" class="btn-secondary" id="retryBtn" style="display:none">請本喵再看一次</button>
        <button type="button" class="btn-primary" id="againBtn" style="display:none">再抽一次</button>
      </div>
    </div>
  </div>
</main>

<footer>
  <div class="foot-inner">
    <div class="zh">解憂商店</div>
    <div class="en">JESSICA</div>
    <div class="tagline">把煩惱留在門外,把好運帶回家</div>
    <div class="foot-social">
      <a href="https://www.instagram.com/jessicaasmr20" target="_blank" rel="noreferrer noopener" aria-label="Instagram">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" width="18" height="18"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.2" cy="6.8" r="0.6" fill="currentColor" stroke="none"/></svg>
      </a>
    </div>
    <div class="foot-rule"></div>
    <p class="fine">© 2026 Jessica 解憂商店·課程影片僅限購買帳號觀看,禁止側錄與轉載</p>
  </div>
</footer>

<script src="./assets/tarot-data.js"></script>
<script>
document.addEventListener("DOMContentLoaded", function () {
  var creditsText = document.getElementById("creditsText");
  var lockedPanel = document.getElementById("lockedPanel");
  var tarotFlow = document.getElementById("tarotFlow");
  var catDialogue = document.getElementById("catDialogue");
  var dialogueAvatar = document.getElementById("dialogueAvatar");
  var dialogueText = document.getElementById("dialogueText");
  var dialogueCaret = document.getElementById("dialogueCaret");
  var topicPanel = document.getElementById("topicPanel");
  var questionPanel = document.getElementById("questionPanel");
  var questionInput = document.getElementById("questionInput");
  var questionHint = document.getElementById("questionHint");
  var drawBtn = document.getElementById("drawBtn");
  var drawOverlay = document.getElementById("drawOverlay");
  var drawVideo = document.getElementById("drawVideo");
  var tarotDeck = document.getElementById("tarotDeck");
  var resultPanel = document.getElementById("resultPanel");
  var cardSummary = document.getElementById("cardSummary");
  var loadingNote = document.getElementById("loadingNote");
  var errorNote = document.getElementById("errorNote");
  var readingSummary = document.getElementById("readingSummary");
  var summaryList = document.getElementById("summaryList");
  var retryBtn = document.getElementById("retryBtn");
  var againBtn = document.getElementById("againBtn");
  var soundToggle = document.getElementById("soundToggle");
  var soundLabel = document.getElementById("soundLabel");

  var topic = null;
  var lastCards = null;
  var refunded = false;

  var TOPIC_REPLY = {
    love: "感情的事啊⋯⋯本喵最懂了。",
    career: "工作上的煩惱嗎?讓本喵看看。",
    money: "金錢的來去,牌面看得很清楚。",
    decision: "在猶豫對不對?那就讓牌推你一把。",
    other: "嗯,說來聽聽吧。"
  };

  // ── 重點標記:本喵用【】框住的字會放大變色 ─────────────────
  function toSegs(line) {
    var segs = [], cur = "", hi = false;
    for (var i = 0; i < line.length; i++) {
      var ch = line[i];
      if (ch === "【" || ch === "】") {
        if (cur) segs.push({ t: cur, hi: hi });
        cur = "";
        hi = ch === "【";
        continue;
      }
      cur += ch;
    }
    if (cur) segs.push({ t: cur, hi: hi });
    return segs;
  }

  function segsLength(segs) {
    return segs.reduce(function (n, s) { return n + s.t.length; }, 0);
  }

  // 只顯示前 n 個字(打字用);框起來的部分包成 <em class="hi">
  function renderSegs(segs, n) {
    var out = "", left = n;
    for (var i = 0; i < segs.length && left > 0; i++) {
      var part = segs[i].t.slice(0, left);
      left -= part.length;
      var esc = part.replace(/&/g, "&amp;").replace(/</g, "&lt;");
      out += segs[i].hi ? '<em class="hi">' + esc + "</em>" : esc;
    }
    return out;
  }

  // ── 對話引擎:一句一句打字,點一下可跳過該句 ─────────────
  var typeTimer = null;

  function speak(lines, onDone) {
    clearTimeout(typeTimer);
    catDialogue.style.display = "block";
    var li = 0, ci = 0, typing = false;

    function typeLine() {
      typing = true;
      dialogueCaret.style.display = "none";
      dialogueText.innerHTML = "";
      ci = 0;
      var segs = toSegs(lines[li]);
      var total = segsLength(segs);
      (function step() {
        if (ci >= total) {
          typing = false;
          dialogueCaret.style.display = "";
          typeTimer = setTimeout(next, 900);
          return;
        }
        dialogueText.innerHTML = renderSegs(segs, ++ci);
        if (ci % 2 === 0) Tarot.Sound.blip(940 + (ci % 3) * 45);
        typeTimer = setTimeout(step, 42);
      })();
    }

    function next() {
      clearTimeout(typeTimer);
      li += 1;
      if (li >= lines.length) {
        catDialogue.onclick = null;
        dialogueCaret.style.display = "none";
        if (onDone) onDone();
      } else {
        typeLine();
      }
    }

    catDialogue.onclick = function () {
      if (typing) {
        clearTimeout(typeTimer);
        typing = false;
        var segs = toSegs(lines[li]);
        dialogueText.innerHTML = renderSegs(segs, segsLength(segs));
        dialogueCaret.style.display = "";
        typeTimer = setTimeout(next, 900);
      } else {
        next();
      }
    };

    typeLine();
  }

  function splitSentences(text) {
    var parts = text.trim().match(/[^。！？!?\n]+[。！？!?]?/g) || [text];
    return parts.map(function (s) { return s.trim(); }).filter(Boolean);
  }

  // ── 額度 ──────────────────────────────────────────
  // 只更新數字。扣款後絕不能連帶把畫面收掉——否則用掉最後一次的人
  // 會在動畫播完後看不到自己的牌,只看到「次數已用完」。
  function updateCredits() {
    creditsText.textContent = "剩餘 " + Tarot.getCredits() + " 次";
  }

  // 擋在「要開始新的一輪」之前:沒次數就直接顯示購買頁,
  // 不讓客人白花力氣選主題、打字、看完動畫才被擋下來。
  function canStartRound() {
    var ok = Tarot.getCredits() > 0;
    updateCredits();
    lockedPanel.style.display = ok ? "none" : "block";
    tarotFlow.style.display = ok ? "block" : "none";
    return ok;
  }

  // ── 音效開關 ───────────────────────────────────────
  function paintSound() {
    var on = Tarot.Sound.isOn();
    soundToggle.classList.toggle("off", !on);
    soundToggle.setAttribute("aria-pressed", String(on));
    soundLabel.textContent = on ? "貓叫聲" : "已靜音";
    soundToggle.querySelector(".wave").style.display = on ? "" : "none";
    soundToggle.querySelector(".cross").style.display = on ? "none" : "";
  }
  soundToggle.addEventListener("click", function () { Tarot.Sound.toggle(); paintSound(); });

  // ── 第一步:本喵先開口,說完才給選主題 ────────────────────
  function startIntro() {
    topicPanel.style.display = "none";
    questionPanel.style.display = "none";
    tarotDeck.style.display = "none";
    tarotDeck.innerHTML = "";
    resultPanel.classList.remove("show");
    speak([
      "歡迎光臨解憂商店,本喵是這裡的占卜師。",
      "把心裡放不下的事交給我,牌會告訴你答案。",
      "先說說看,今天想問的是哪方面呢?"
    ], function () {
      topicPanel.style.display = "block";
      topicPanel.scrollIntoView({ behavior: "smooth", block: "center" });
    });
  }

  // ── 第二步:選主題,本喵回話,說完才給打字 ─────────────────
  document.querySelectorAll(".topic-chip").forEach(function (chip) {
    chip.addEventListener("click", function () {
      document.querySelectorAll(".topic-chip").forEach(function (c) { c.classList.remove("active"); });
      chip.classList.add("active");
      topic = chip.dataset.topic;
      questionPanel.style.display = "none";
      speak([TOPIC_REPLY[topic], "那麼,把你想問的事寫下來給本喵看吧。"], function () {
        questionPanel.style.display = "block";
        questionInput.focus();
        questionPanel.scrollIntoView({ behavior: "smooth", block: "center" });
      });
    });
  });

  // ── 第三步:至少五個字,不夠本喵會提醒 ─────────────────────
  function questionIsReady() {
    var q = questionInput.value.trim();
    if (q.length >= 5) {
      questionHint.textContent = "至少寫五個字,本喵才聽得清楚";
      questionHint.classList.remove("is-error");
      questionInput.classList.remove("is-error");
      return true;
    }
    questionHint.textContent = "你說的有點少,再多寫一點讓本喵聽清楚";
    questionHint.classList.add("is-error");
    questionInput.classList.add("is-error");
    questionInput.focus();
    return false;
  }

  questionInput.addEventListener("input", function () {
    if (questionHint.classList.contains("is-error") && questionInput.value.trim().length >= 5) {
      questionIsReady();
    }
  });

  drawBtn.addEventListener("click", function () {
    if (!questionIsReady()) return;
    if (!canStartRound()) return;
    questionPanel.style.display = "none";
    topicPanel.style.display = "none";
    speak(["要在心中默念你的心意喔,本喵要開始了。"], function () {
      Tarot.useCredit();
      updateCredits();
      playShuffle(revealCards);
    });
  });

  // ── 第四步:滿版洗牌動畫,鎖住捲動、看完才淡出 ───────────────
  function playShuffle(next) {
    var done = false;
    var guard = null;

    function finish() {
      if (done) return;
      done = true;
      clearTimeout(guard);
      drawVideo.removeEventListener("ended", finish);
      drawVideo.removeEventListener("error", finish);
      drawVideo.removeEventListener("playing", armGuard);
      drawOverlay.classList.add("fading");
      setTimeout(function () {
        drawOverlay.style.display = "none";
        drawOverlay.classList.remove("fading");
        drawVideo.pause();
        document.body.classList.remove("no-scroll");
        next();
      }, 900);
    }

    // 正常情況靠 ended 收尾。保險計時依影片實際長度算(換影片不用改這裡),
    // 並從真正開始播放才起算,網路慢時才不會把影片攔腰切斷。
    function armGuard() {
      clearTimeout(guard);
      var dur = isFinite(drawVideo.duration) && drawVideo.duration > 0 ? drawVideo.duration : 9;
      guard = setTimeout(finish, (dur - drawVideo.currentTime + 1) * 1000);
    }

    drawVideo.addEventListener("ended", finish);
    drawVideo.addEventListener("error", finish);
    drawVideo.addEventListener("playing", armGuard);

    document.body.classList.add("no-scroll");
    drawOverlay.style.display = "block";
    drawVideo.currentTime = 0;
    drawVideo.muted = !Tarot.Sound.isOn();
    var p = drawVideo.play();
    if (p && p.catch) p.catch(finish);
    // 完全播不起來(被瀏覽器擋下、檔案壞掉)時的最後防線
    guard = setTimeout(finish, 6000);
  }

  // ── 第五步:翻牌 ───────────────────────────────────
  function buildDeck(cards) {
    tarotDeck.innerHTML = "";
    cards.forEach(function (c, i) {
      var el = document.createElement("div");
      el.className = "tarot-card pending";
      el.dataset.i = i;
      el.style.animationDelay = i * 0.09 + "s";
      el.innerHTML =
        '<div class="tarot-card-inner">' +
          '<div class="tarot-card-face tarot-card-back"></div>' +
          '<div class="tarot-card-face tarot-card-front">' + Tarot.catFace(c.mood, false) +
            '<div class="name">' + c.name + "</div>" +
            '<div class="orientation">' + (c.orientation === "upright" ? "正位" : "逆位") + "</div>" +
          "</div>" +
        "</div>";
      tarotDeck.appendChild(el);
    });
    return tarotDeck.querySelectorAll(".tarot-card");
  }

  function sparkle(el) {
    for (var i = 0; i < 7; i++) {
      var s = document.createElement("span");
      s.className = "cat-sparkle";
      var angle = (Math.PI * 2 * i) / 7 + Math.random() * 0.5;
      var dist = 26 + Math.random() * 20;
      s.style.setProperty("--dx", Math.cos(angle) * dist + "px");
      s.style.setProperty("--dy", Math.sin(angle) * dist + "px");
      s.style.animationDelay = Math.random() * 0.12 + "s";
      el.appendChild(s);
      setTimeout(function (node) { return function () { node.remove(); }; }(s), 950);
    }
  }

  function revealCards() {
    var cards = Tarot.drawThree();
    lastCards = cards;
    refunded = false;
    var cardEls = buildDeck(cards);
    tarotDeck.style.display = "grid";
    cardSummary.innerHTML = "";
    resultPanel.classList.add("show");
    tarotDeck.scrollIntoView({ behavior: "smooth", block: "center" });

    cards.forEach(function (c, i) {
      setTimeout(function () {
        var el = cardEls[i];
        el.classList.remove("pending");
        el.classList.add("flipped", "just-flipped");
        sparkle(el);
        Tarot.Sound.meow(0, 560 + i * 90);
        setTimeout(function () { el.classList.remove("just-flipped"); }, 700);

        var li = document.createElement("li");
        li.innerHTML = "<b>" + c.name + (c.orientation === "upright" ? "" : "(逆位)") + "</b><span>" + c.meaning + "</span>";
        cardSummary.appendChild(li);
      }, 300 + i * 520);
    });

    setTimeout(function () {
      Tarot.Sound.purr(2.2);
      requestReading(cards);
    }, 300 + cards.length * 520 + 250);
  }

  // ── 第六步:本喵一句一句說解讀,說完列成總表 ────────────────
  function speakReading(text) {
    var lines = splitSentences(text);
    speak(lines, function () {
      summaryList.innerHTML = "";
      lines.forEach(function (s) {
        var el = document.createElement("li");
        var segs = toSegs(s);
        el.innerHTML = renderSegs(segs, segsLength(segs));
        summaryList.appendChild(el);
      });
      catDialogue.style.display = "none";
      readingSummary.style.display = "block";
      againBtn.style.display = "inline-flex";
      Tarot.Sound.purr(1.6);
      readingSummary.scrollIntoView({ behavior: "smooth", block: "center" });
    });
    catDialogue.scrollIntoView({ behavior: "smooth", block: "center" });
  }

  function failReading(msg) {
    loadingNote.style.display = "none";
    errorNote.textContent = msg;
    errorNote.style.display = "block";
    retryBtn.style.display = "inline-flex";
    againBtn.style.display = "inline-flex";
    if (!refunded) {
      refunded = true;
      Tarot.addCredits(1);
      updateCredits();
    }
  }

  function requestReading(cards) {
    loadingNote.style.display = "block";
    errorNote.style.display = "none";
    retryBtn.style.display = "none";
    againBtn.style.display = "none";
    readingSummary.style.display = "none";
    catDialogue.style.display = "none";

    var controller = "AbortController" in window ? new AbortController() : null;
    var timer = controller ? setTimeout(function () { controller.abort(); }, 25000) : null;

    fetch(Tarot.API_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        topic: topic || "other",
        question: questionInput.value,
        cards: cards.map(function (c) { return { name: c.name, orientation: c.orientation, keyword: c.keyword }; })
      }),
      signal: controller ? controller.signal : undefined
    })
      .then(function (res) { return res.json(); })
      .then(function (data) {
        if (timer) clearTimeout(timer);
        loadingNote.style.display = "none";
        if (data && data.ok) speakReading(data.reading);
        else failReading((data && data.error) || "本喵現在有點累,請稍後再試");
      })
      .catch(function () {
        if (timer) clearTimeout(timer);
        failReading("連線逾時,請確認網路後再試一次");
      });
  }

  retryBtn.addEventListener("click", function () {
    if (lastCards) requestReading(lastCards);
  });

  againBtn.addEventListener("click", function () {
    clearTimeout(typeTimer);
    readingSummary.style.display = "none";
    againBtn.style.display = "none";
    retryBtn.style.display = "none";
    errorNote.style.display = "none";
    questionInput.value = "";
    topic = null;
    document.querySelectorAll(".topic-chip").forEach(function (c) { c.classList.remove("active"); });
    if (!canStartRound()) return;   // 次數用完就直接看到加購頁,不再走一次流程
    startIntro();
    catDialogue.scrollIntoView({ behavior: "smooth", block: "center" });
  });

  dialogueAvatar.innerHTML = Tarot.catFace("happy", false);
  document.getElementById("thinkingCat").innerHTML = Tarot.catFace("calm", false);
  paintSound();
  if (canStartRound()) startIntro();
});
</script>
