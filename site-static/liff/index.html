<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>喵喵占卜|每日一牌</title>
<meta name="description" content="每天一張牌,本喵陪你看今天。" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Huninn&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../tarot/assets/base.css" />
<link rel="stylesheet" href="../tarot/assets/tarot.css" />
<link rel="stylesheet" href="./liff.css" />
<link rel="stylesheet" href="./fx.css" />
<!-- LIFF SDK:stub 模式(?stub=<userId>)下不需要它也能跑 -->
<script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js" defer></script>
</head>
<body class="tarot-page liff-page">

<!-- 頂欄:streak 與加深額度 -->
<header class="liff-top">
  <div class="liff-brand">喵喵占卜</div>
  <div class="liff-stats">
    <span id="statStreak" class="liff-stat" title="連續抽牌天數">🐾 0</span>
    <span id="statCredits" class="liff-stat" title="加深解讀額度">✦ 0</span>
  </div>
</header>

<main class="liff-main">

  <!-- 載入/錯誤 -->
  <section id="viewLoading" class="liff-view">
    <div class="liff-cat-wait" id="loadingCat"></div>
    <p class="liff-hint" id="loadingText">本喵正在鋪桌布⋯</p>
  </section>

  <!-- 日抽:切牌儀式 -->
  <section id="viewDraw" class="liff-view" hidden>
    <h1 class="liff-title">今天的牌</h1>
    <p class="liff-sub">心裡想著今天,然後把牌堆切開。</p>
    <div class="liff-deck" id="deck">
      <div class="liff-deck-stack">
        <div class="liff-card-back"></div>
        <div class="liff-card-back"></div>
        <div class="liff-card-back"></div>
      </div>
      <input id="cutSlider" class="liff-cut" type="range" min="0" max="1000" value="500"
             aria-label="切牌位置" />
      <p class="liff-hint">左右滑動決定切點,放開就抽牌</p>
    </div>
  </section>

  <!-- 翻牌與短評 -->
  <section id="viewReveal" class="liff-view" hidden>
    <div class="liff-flip" id="flipWrap">
      <div class="liff-flip-inner" id="flipInner">
        <div class="liff-flip-back liff-card-back"></div>
        <div class="liff-flip-front" id="cardFront">
          <img id="cardImg" alt="" />
          <div class="liff-card-name" id="cardName"></div>
        </div>
      </div>
    </div>
    <div class="liff-newcard" id="newCardBadge" hidden>✧ 新收藏!圖鑑點亮一格</div>
    <div class="liff-reading" id="dailyReading" hidden>
      <p id="dailyText"></p>
    </div>
    <button class="liff-share-btn" id="shareBtn" hidden>把今天的牌分享出去 ↗</button>
    <div class="liff-upsell" id="upsell" hidden>
      <button class="btn-primary liff-btn" id="deepenBtn">把這張牌看透 ✦</button>
      <p class="liff-upsell-note" id="deepenNote"></p>
    </div>
    <div class="liff-deep-reading" id="deepReading" hidden></div>
  </section>

  <!-- 圖鑑 -->
  <section id="viewCollection" class="liff-view" hidden>
    <h1 class="liff-title">我的牌歷</h1>
    <p class="liff-sub"><span id="collCount">0</span> / 78 張已相遇</p>
    <div class="liff-grid" id="collGrid"></div>
  </section>

</main>

<!-- 底部導覽 -->
<nav class="liff-nav">
  <button class="liff-nav-btn is-active" id="navToday">今日</button>
  <button class="liff-nav-btn" id="navCollection">圖鑑</button>
</nav>

<script src="./fx.js"></script>
<script src="./share.js"></script>
<script src="./liff.js"></script>
</body>
</html>
